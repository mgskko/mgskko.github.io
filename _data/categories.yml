# 분야(그룹) : 색은 slot 순서(1~5)로 고정한다. 순서를 바꾸면 색 구분 검증이 깨진다.
groups:
  - id: coding
    label: "코딩테스트"
    slot: 1
    icon: code
    desc: "알고리즘 문제를 풀고 접근 방법을 정리해요"
  - id: cs
    label: "CS"
    slot: 2
    icon: cpu
    desc: "운영체제, 데이터베이스 같은 컴퓨터 기초"
  - id: data
    label: "데이터"
    slot: 3
    icon: chart
    desc: "분석, 시각화, 데이터 운영"
  - id: ai
    label: "AI · ML"
    slot: 4
    icon: spark
    desc: "머신러닝, 딥러닝, 수학 기초와 AI 활용"
  - id: dev
    label: "개발"
    slot: 5
    icon: terminal
    desc: "언어, 도구, 프로젝트와 바이브코딩"


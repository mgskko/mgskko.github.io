<footer class="footer">
  <div class="footer__inner">
    <div>
      <p class="footer__title">{{ site.title }}</p>
      <p class="footer__desc">{{ site.description }}</p>
    </div>
    <div class="footer__links">
      <a class="chip pressable" href="https://github.com/{{ site.author.github }}" rel="noopener">{% include icon.html name="github" %}GitHub</a>
      <a class="chip pressable" href="{{ '/feed.xml' | relative_url }}">{% include icon.html name="rss" %}RSS</a>
    </div>
  </div>
  <p class="footer__copy">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
</footer>

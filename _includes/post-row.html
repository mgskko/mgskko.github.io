{%- assign p = include.post -%}
{%- assign pk = p.categories[0] -%}
{%- include cat-meta.html key=pk -%}
<li class="row" data-group="{{ cm_group }}" data-cat="{{ pk }}">
  <a class="row__link pressable" href="{{ p.url | relative_url }}">
    <span class="cat-icon s{{ cm_slot }}">{% include icon.html name=cm_icon %}</span>
    <span class="row__body">
      <span class="row__title">{{ p.title | escape }}</span>
      <span class="row__meta">{{ cm_label }}<i class="dot"></i><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: site.date_format }}</time></span>
    </span>
    {% include icon.html name="chevron" class="row__chev" %}
  </a>
</li>

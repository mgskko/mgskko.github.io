<header class="topbar" data-topbar>
  <div class="topbar__inner">
    <a class="brand pressable" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
      <span class="brand__mark" aria-hidden="true">S</span>
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="topnav" aria-label="주요 메뉴">
      <a href="{{ '/' | relative_url }}" data-nav="home">홈</a>
      <a href="{{ '/categories/' | relative_url }}" data-nav="categories">카테고리</a>
      <a href="{{ '/tags/' | relative_url }}" data-nav="tags">태그</a>
      <a href="{{ '/archive/' | relative_url }}" data-nav="archive">아카이브</a>
    </nav>
    <div class="topbar__actions">
      <button class="searchbtn pressable" type="button" data-search-open aria-label="글 검색">
        {% include icon.html name="search" %}<span class="searchbtn__label">검색</span><kbd class="searchbtn__kbd">⌘K</kbd>
      </button>
      <button class="iconbtn pressable" type="button" data-theme-toggle aria-label="화면 테마 바꾸기">
        {% include icon.html name="moon" class="i-moon" %}{% include icon.html name="sun" class="i-sun" %}
      </button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span data-progress></span></div>
</header>

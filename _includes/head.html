<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    document.documentElement.classList.add("js");
  })();
</script>
{% include seo.html %}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% feed_meta %}
<link rel="icon" type="image/png" href="{{ '/assets/logo.ico/favicon-96x96.png' | relative_url }}" sizes="96x96">
<link rel="manifest" href="{{ '/assets/logo.ico/site.webmanifest' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.ico/favicon.svg' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/logo.ico/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/logo.ico/apple-touch-icon.png' | relative_url }}">
{% if jekyll.environment == "production" and site.analytics.google.tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.analytics.google.tracking_id }}');</script>
{% endif %}

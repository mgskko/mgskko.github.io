# ------------------------------------------------------------
# Study Note : 직접 만든 Jekyll 테마 (GitHub Pages 기본 빌드 호환)
# ------------------------------------------------------------

# Site
locale: "ko-KR"
lang: "ko"
title: "Study Note"
tagline: "배운 것을 기록하고, 데이터로 돌아봐요"
description: "공부일지 · 코딩테스트, 데이터 분석, AI·ML, CS를 기록합니다."
url: "https://mgskko.github.io"
baseurl: ""
repository: "mgskko/mgskko.github.io"
timezone: "Asia/Seoul"

# Author
author:
  name: "Happy Day:)"
  bio: "Math, Computer Engineering"
  avatar: "https://i.esdrop.com/d/f/uVJApfFjHN/JuPS6b7yOr.png"
  location: "Republic of Korea"
  github: "mgskko"

# 검색엔진 소유 확인 (Search Console / Naver Search Advisor / Bing Webmaster 에서 받은 메타태그 값)
google_site_verification: "kZHgYWkSWI2Ca4AhSYY-otGB6fqbeCKE416RW3UxF0k"
naver_site_verification:
bing_site_verification:

# Analytics (Google gtag)
analytics:
  google:
    tracking_id: "G-LLCN1XBQXJ"

# Comments (Disqus, 화면에 보일 때 불러옴)
comments:
  provider: "disqus"
  disqus:
    shortname: "mgskkoNote"

# Reading
reading_chars_per_minute: 800

# Build
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
permalink: /:categories/:title/
date_format: "%Y.%m.%d"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-sitemap
  - jekyll-feed

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      comments: true

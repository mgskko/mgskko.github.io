<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  {% include head.html %}
</head>
<body data-page="{{ page.nav | default: layout.nav | default: 'post' }}">
  {% include icons.html %}
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  {% include header.html %}
  <main id="main" class="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include tabbar.html %}
  {% include search.html %}
  <script src="{{ '/assets/js/fx.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script>window.SITE={search:"{{ '/search.json' | relative_url }}"};</script>
  {% if layout.post_js %}<script src="{{ '/assets/js/post.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
  <script src="{{ '/assets/js/app.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% if layout.charts or page.charts %}<script src="{{ '/assets/js/charts.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
</body>
</html>
